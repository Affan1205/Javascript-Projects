<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Time Character Count</title>
    <link rel="stylesheet" href="style.css" />
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="wrapper">
      <div class="counter-card">
        <p class="heading">Real-Time Character Counter</p>

        <input type="text" class="textInput" maxlength="50" placeholder="Please write your text here..." />

        <div class="counter">
          <p>Total Character : <span class="total-character"></span></p>
          <p>Remaining : <span class="remaining-character"></span></p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

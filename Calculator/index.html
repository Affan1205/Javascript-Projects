<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <h1>Calculator</h1>

        <div class="calculator-container">
          <input type="text" placeholder="" class="userInput" />

          <div class="operation-container">
            <button class="btn btnc">c</button>
            <button class="btn btndiv btncalculate">/</button>
            <button class="btn btnmul btncalculate">*</button>
            <button class="btn btnsub btncalculate">-</button>
            <button class="btn btn7 btncalculate">7</button>
            <button class="btn btn8 btncalculate">8</button>
            <button class="btn btn9 btncalculate">9</button>
            <button class="btn btnplus btncalculate">+</button>
            <button class="btn btn4 btncalculate">4</button>
            <button class="btn btn5 btncalculate">5</button>
            <button class="btn btn6 btncalculate">6</button>
            <button class="btn btnequal">=</button>
            <button class="btn btn1 btncalculate">1</button>
            <button class="btn btn2 btncalculate">2</button>
            <button class="btn btn3 btncalculate">3</button>
            <button class="btn"></button>
            <button class="btn btn0 btncalculate">0</button>
            <button class="btn btnpoint btncalculate">.</button>
            <button class="btn"></button>
            <button class="btn"></button>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

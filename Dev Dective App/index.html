<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Detective</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <!-- heading seciton -->
        <div class="heading-container">
          <h1 class="h1heading">DevDetective</h1>

          <div class="mode-changer">
            <button class="text-mode darkBtn">Dark <i class="fa-solid fa-moon"></i></button>
            <button class="text-mode lightBtn">Light <i class="fa-regular fa-sun"></i></button>
          </div>
        </div>

        <!-- form container -->
        <form class="form-container">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" fill="#0079ff" width="25" height="25" viewBox="0 0 50 50">
            <path
              d="M 21 3 C 11.621094 3 4 10.621094 4 20 C 4 29.378906 11.621094 37 21 37 C 24.710938 37 28.140625 35.804688 30.9375 33.78125 L 44.09375 46.90625 L 46.90625 44.09375 L 33.90625 31.0625 C 36.460938 28.085938 38 24.222656 38 20 C 38 10.621094 30.378906 3 21 3 Z M 21 5 C 29.296875 5 36 11.703125 36 20 C 36 28.296875 29.296875 35 21 35 C 12.703125 35 6 28.296875 6 20 C 6 11.703125 12.703125 5 21 5 Z"
            ></path>
          </svg>

          <input type="text" placeholder="Enter your Github username..." class="searchInput" />

          <button class="clear-search"><i class="fa-solid fa-xmark"></i></button>

          <button type="submit" class="search-btn">Search</button>

          <p class="result">No Result Found</p>
        </form>

        <!-- profile section -->
        <div class="profile-container">
          <div class="profile-heading">
            <div class="img-section">
              <img src="" class="profile-image" />
            </div>

            <div class="profile-content-section">
              <div class="profile-content">
                <div class="user-name-container">
                  <p class="user-name"></p>
                  <a href="" class="github-id">@</a>
                </div>

                <div class="join-section">
                  <p class="user-join-date"></p>
                </div>
              </div>

              <p class="user-bio"></p>
            </div>
          </div>

          <div class="activity-social-section">
            <div class="user-activity-section">
              <!-- repo -->
              <div class="repos activity">
                <p class="design">Repos</p>
                <span class="repos-count count"></span>
              </div>

              <!-- followers -->
              <div class="followers activity">
                <p class="design">Followers</p>
                <span class="followers-count count"></span>
              </div>

              <!-- Following -->
              <div class="followings activity">
                <p class="design">Followings</p>
                <span class="followings-count count"></span>
              </div>
            </div>

            <div class="social-links">
              <div class="links">
                <i class="fa-solid fa-location-dot"></i>
                <span class="user-address"></span>
              </div>
              <div class="links">
                <i class="fa-solid fa-link"></i>
                <a href="" class="user-portfolio-link"></a>
              </div>
              <div class="links">
                <i class="fa-brands fa-twitter"></i>
                <a href="" class="user-twitter-link"></a>
              </div>
              <div class="links">
                <i class="fa-solid fa-building"></i>
                <span class="user-organization"></span>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="style.css"> -->
    <title>Password Generator</title>
  </head>
  <body>
    <div class="container">
      <h1>Password Generator</h1>

      <div class="display-container">
        <!-- input -->
        <input type="text" readonly placeholder="Password" class="display" data-passwordDisplay />

        <!-- copy button -->
        <button data-copy class="copyBtn">
          <span data-copyMsg class="tooltip"></span>
          <img src="./assets/copy.svg" alt="copy" width="23" height="23" />
        </button>
      </div>

      <div class="input-container">
        
        <!-- password length section -->
        <div class="length-container">
          <p>Password Length</p>

          <p data-lengthNumber>0</p>
        </div>

        <!-- slider -->
        <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider />

        <!-- checkboxes -->
        <div class="check">
          <input type="checkbox" id="uppercase" />
          <label for="uppercase">Includes uppercase letter</label>
        </div>
        <div class="check">
          <input type="checkbox" id="lowercase" />
          <label for="lowercase">Includes lowercase letter</label>
        </div>
        <div class="check">
          <input type="checkbox" id="numbers" />
          <label for="number">Includes number</label>
        </div>
        <div class="check">
          <input type="checkbox" id="symbols" />
          <label for="symbol">Includes symbol</label>
        </div>

        <!-- strength section -->
        <div class="strength-container">
          <p>Strength</p>
          <div data-indicator class="indicator"></div>
        </div>

        <!-- generate password button -->
        <button class="generateButton">Generate Password</button>

      </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
